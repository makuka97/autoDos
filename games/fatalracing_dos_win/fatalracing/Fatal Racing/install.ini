Colours=4,4,4

Language=English
Language=Francais
Language=Deutsch
DefaultLanguage=English

Title=FATAL RACING

OSVersion=5.00

CPUType=486

BaseMemory=0

ExtendedMemory=0

ExpandedMemory=0

ConfigurationFileName=CONFIG.INI

ReadMeFileName=READ.ME

DefaultPath=\FATAL

CDSpeedTest=DOS4GW.EXE

BootDiskConfig
{
FILES=20
BUFFERS=20,0
REM Remember to insert your CD driver and mouse driver if necessary
}

BootDiskAutoexec
{
@ECHO OFF
PROMPT $P$G
PATH=C:\DOS
C:
REM Remember to insert your CD driver and mouse driver if necessary
}

Installation
{
@Installing
copy %SourcePath%\install.exe
copy %SourcePath%\install.ini
copy %SourcePath%\read.me
copy %SourcePath%\unarj.exe

md fatdata
md replays

copy %SourcePath%\fatal.arj
unarj x fatal.arj
del fatal.arj

#fatal.a01,Disk2
copy %SourcePath%\fatal.a01
unarj x fatal.a01
del fatal.a01

#fatal.a02,Disk3
copy %SourcePath%\fatal.a02
unarj x fatal.a02
del fatal.a02

#fatal.a03,Disk4
copy %SourcePath%\fatal.a03
unarj x fatal.a03
del fatal.a03

#fatal.a04,Disk5
copy %SourcePath%\fatal.a04
unarj x fatal.a04
del fatal.a04

#fatal.a05,Disk6
@credit
copy %SourcePath%\fatal.a05
unarj x fatal.a05
del fatal.a05

del unarj.exe


}
