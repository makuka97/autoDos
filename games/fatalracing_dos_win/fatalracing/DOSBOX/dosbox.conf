
[sdl]

fullscreen=true
fulldouble=false
fullresolution=original
windowresolution=original
output=overlay
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper.txt
usescancodes=true

[dosbox]

language=
machine=svga_s3
captures=..\screenshots
memsize=16

[render]

frameskip=0
aspect=true
scaler=normal2x

[cpu]

core=auto
cputype=auto
cycles=max
cycleup=1000
cycledown=1000

[mixer]

nosound=false
rate=22050
blocksize=2048
prebuffer=80

[midi]

mpu401=intelligent
device=default
config=

[sblaster]

type=sb16
base=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto
oplrate=22050

[gus]

gus=false

[speaker]

pcspeaker=true
pcrate=22050
tandy=auto
tandyrate=22050
disney=true

[joystick]

joysticktype=auto
timed=true
autofire=false
swap34=false
buttonwrap=true

[serial]

serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]

xms=true
ems=true
umb=true
keyboardlayout=none

